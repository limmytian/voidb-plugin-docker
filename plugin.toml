default_timeout_ms = 30000

[[capabilities]]
id = "container_action"
description = "Start, stop, restart, or remove one Docker container."
input_schema = "schemas/container_action-input.schema.json"
output_schema = "schemas/container_action-output.schema.json"
permissions = ["connection.write", "docker.containers.lifecycle"]
risk = "destructive"
destructive = true
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = true
default_timeout_ms = 30000

[ui]
tui = true

[requirements]
voidb_core = ">=0.1.0"
platforms = ["darwin", "linux", "windows"]
