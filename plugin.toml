required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "exec_signal"
description = "Signal one controlled Docker exec process by its daemon-reported PID."
input_schema = "schemas/exec_signal-input.schema.json"
output_schema = "schemas/exec_signal-output.schema.json"
permissions = ["connection.write", "docker.containers.exec"]
risk = "destructive"
destructive = true
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "attach_read"
description = "Read bounded output from an explicit Docker container attach."
input_schema = "schemas/attach_read-input.schema.json"
output_schema = "schemas/attach_read-output.schema.json"
permissions = ["connection.read", "docker.containers.attach"]
risk = "read_only"
destructive = false
streaming = true
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "attach_input"
description = "Write bounded text to an explicit Docker container attach."
input_schema = "schemas/attach_input-input.schema.json"
output_schema = "schemas/attach_input-output.schema.json"
permissions = ["connection.write", "docker.containers.attach"]
