version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/resource/container_id"
label = "Container"
value_type = "resource_id"
required = true
constraint = "exact"
risk_emphasis = "normal"

[capabilities.session_handoff]
capabilities = ["docker.logs_follow"]

[capabilities.session_handoff.purpose]
kind = "log_stream"

[capabilities.session_handoff.live_session]
protocol_version = 1
start_risk = "read_only"

[capabilities.session_handoff.live_session.kind]
kind = "log"

[capabilities.session_handoff.live_session.resource]
resource_type = "docker_container"
identity_fields = ["/container_id"]
audit_identity = "fingerprint"

[capabilities.session_handoff.live_session.resource.identity_schema]
additionalProperties = false
required = ["container_id"]
type = "object"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.container_id]
maxLength = 256
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.start_parameters_schema]
additionalProperties = false
type = "object"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.tail]
default = 100
maximum = 5000
minimum = 1
type = "integer"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.timestamps]
default = true
type = "boolean"

[capabilities.session_handoff.live_session.event_schema]
maxProperties = 16
type = "object"

[capabilities.session_handoff.live_session.operations]
events = "docker.logs_follow"

[capabilities.session_handoff.live_session.buffer]
max_events = 2000
max_bytes = 2097152
overflow = "drop_oldest"

[capabilities.session_handoff.live_session.reconnect]
mode = "transient"
max_attempts = 8
initial_backoff_ms = 250
max_backoff_ms = 10000
resume = "best_effort_cursor"
cursor_kind = "timestamp"

[capabilities.session_handoff.live_session.delivery]
backpressure = "bounded_buffer"
cursor_scope = "optional"
max_read_wait_ms = 30000

[capabilities.session_handoff.live_session.delivery.heartbeat]

[capabilities.session_handoff.live_session.control]
cancel = "call_only"
close = "stop_observation"

